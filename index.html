<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radial Drilling Machine</title>
  <style>
    :root { --border: #d0d7de; --muted: #656d76; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: #1f2328; background: #f6f8fa; }
    .banner { width: 100%; height: 340px; background: #222 center / cover no-repeat; position: relative; }
    .banner h1 { position: absolute; bottom: 0; left: 0; right: 0; margin: 0; padding: 24px 20px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
    .desc { font-size: 1.05rem; line-height: 1.5; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; transition: transform .15s, box-shadow .15s; }
    .card:hover, .card:focus-visible { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.12); }
    .thumb { height: 130px; display: flex; align-items: center; justify-content: center; background: #eef1f4 center / cover no-repeat; }
    .icon { width: 64px; height: 78px; border-radius: 6px; color: #fff; font-weight: 700; font-size: .85rem; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    .info { padding: 12px 14px 14px; }
    .info h3 { margin: 0 0 4px; font-size: 1rem; color: #0969da; }
    .info p { margin: 0; font-size: .875rem; color: var(--muted); }
    .badge { display: inline-block; margin-top: 8px; font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: #eaeef2; color: var(--muted); }
    .pdf { background: #d1242f; } .doc { background: #2b579a; } .xls { background: #1d6f42; } .img { background: #8250df; } .generic { background: #6e7781; }
  </style>
</head>
<body>
  <div class="banner" id="banner" role="img" aria-label="Radial drilling machine">
    <h1>Radial Drilling Machine</h1>
  </div>
  <main>
    <p class="desc" id="desc"></p>
    <h2>Files</h2>
    <div class="gallery" id="gallery"></div>
    <noscript><p>Please enable JavaScript to view the file list, or browse the <a href="https://github.com/Sasos-ops/Radial-Drilling-Machine">repository</a>.</p></noscript>
  </main>
  <script>
    var TYPES = {
      pdf: ['pdf', 'PDF'], doc: ['doc', 'DOC'], docx: ['doc', 'DOCX'],
      xls: ['xls', 'XLS'], xlsx: ['xls', 'XLSX'], csv: ['xls', 'CSV'],
      png: ['img', 'PNG'], jpg: ['img', 'JPG'], jpeg: ['img', 'JPG'], gif: ['img', 'GIF'], webp: ['img', 'WEBP']
    };
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      return e;
    }
    fetch('files.json').then(function (r) { return r.json(); }).then(function (m) {
      var banner = document.getElementById('banner');
      banner.style.backgroundImage = 'url("' + encodeURI(m.banner) + '")';
      document.getElementById('desc').textContent = m.description;
      var base = 'https://github.com/' + m.repo + '/blob/' + m.branch + '/';
      var gallery = document.getElementById('gallery');
      m.files.forEach(function (f) {
        var ext = f.file.split('.').pop().toLowerCase();
        var t = TYPES[ext] || ['generic', ext.toUpperCase() || 'FILE'];
        var a = el('a', 'card');
        a.href = base + encodeURIComponent(f.file).replace(/%2F/g, '/');
        var thumb = el('div', 'thumb');
        if (t[0] === 'img') {
          thumb.style.backgroundImage = 'url("' + encodeURI(f.file) + '")';
        } else {
          thumb.appendChild(el('div', 'icon ' + t[0], t[1]));
        }
        var info = el('div', 'info');
        info.appendChild(el('h3', '', f.title || f.file));
        if (f.description) info.appendChild(el('p', '', f.description));
        info.appendChild(el('span', 'badge', t[1]));
        a.appendChild(thumb);
        a.appendChild(info);
        gallery.appendChild(a);
      });
    }).catch(function () {
      document.getElementById('desc').textContent = 'Could not load files.json.';
    });
  </script>
</body>
</html>
